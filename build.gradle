            "thunder_axe":      ["template_3d_axe",    "AXE",    [0x2B2200, 0xF9A825, 0xFFEA00, 0xFFFFFF]],
            "void_axe":         ["template_3d_axe",    "AXE",    [0x0B0018, 0x4A148C, 0xAA00FF, 0xEA80FC]],
            "earth_axe":        ["template_3d_axe",    "AXE",    [0x28180B, 0x5D4037, 0x8D6E63, 0xDCE775]],

            // 4. Maces & Hammers
            "thunder_mace":     ["template_3d_mace",   "MACE",   [0x261E00, 0xF57F17, 0xFFD600, 0xFFFFFF]],
            "earth_mace":       ["template_3d_mace",   "MACE",   [0x24160A, 0x4E342E, 0x795548, 0xAED581]],
            "void_mace":        ["template_3d_mace",   "MACE",   [0x090012, 0x311B92, 0x7C4DFF, 0xE040FB]],
            "inferno_mace":     ["template_3d_mace",   "MACE",   [0x330800, 0xB71C1C, 0xFF5722, 0xFFEE58]],
            "celestial_mace":   ["template_3d_mace",   "MACE",   [0x332800, 0xFFA000, 0xFFFF00, 0xFFFFFF]],
            "earth_hammer":     ["template_3d_hammer", "HAMMER", [0x1F140A, 0x4E342E, 0x8D6E63, 0xC5E1A5]],
            "gravity_hammer":   ["template_3d_hammer", "HAMMER", [0x0D0221, 0x261447, 0x6A0572, 0xF72585]],

            // 5. Spears & Tridents
            "thunder_spear":    ["template_3d_spear",  "SPEAR",  [0x282000, 0xFBC02D, 0xFFEE58, 0xFFFFFF]],
            "ocean_spear":      ["template_3d_spear",  "SPEAR",  [0x001E3C, 0x0277BD, 0x00B0FF, 0x80D8FF]],
            "flame_spear":      ["template_3d_spear",  "SPEAR",  [0x3A0900, 0xD84315, 0xFF6D00, 0xFFD54F]],
            "frost_spear":      ["template_3d_spear",  "SPEAR",  [0x051923, 0x006494, 0x00A6FB, 0xE0F7FA]],
            "void_spear":       ["template_3d_spear",  "SPEAR",  [0x090014, 0x3C096C, 0x9D4EDD, 0xE0AAFF]],
            "wind_spear":       ["template_3d_spear",  "SPEAR",  [0x082A1D, 0x2E7D32, 0x69F0AE, 0xE8F5E9]],
            "ancient_spear":    ["template_3d_spear",  "SPEAR",  [0x2D1E10, 0x8D6E63, 0xFFD54F, 0xFFF8E1]],

            // 6. Scythes
            "wind_scythe":      ["template_3d_scythe", "SCYTHE", [0x07291D, 0x00897B, 0x64FFDA, 0xE0F2F1]],
            "soul_scythe":      ["template_3d_scythe", "SCYTHE", [0x0A1E26, 0x006064, 0x00E5FF, 0xB2EBF2]],

            // 7. Bows
            "storm_bow":        ["template_3d_bow",    "BOW",    [0x1E272C, 0x0288D1, 0xFFEA00, 0xFFFFFF]],
            "inferno_bow":      ["template_3d_bow",    "BOW",    [0x2E0900, 0xD84315, 0xFF6D00, 0xFFEE58]],
            "frost_bow":        ["template_3d_bow",    "BOW",    [0x082032, 0x0277BD, 0x4FC3F7, 0xFFFFFF]],
            "void_bow":         ["template_3d_bow",    "BOW",    [0x0B001A, 0x4A148C, 0xAA00FF, 0xF3E5F5]],
            "wind_bow":         ["template_3d_bow",    "BOW",    [0x0A2E1F, 0x2E7D32, 0x00E676, 0xE8F5E9]],
            "tempest_bow":      ["template_3d_bow",    "BOW",    [0x072227, 0x35858B, 0x4FBDBA, 0xAEFEFF]],

            // 8. Staffs & Wands
            "thunder_staff":    ["template_3d_staff",  "STAFF",  [0x2E2400, 0x997A00, 0xFFDD00, 0xFFFFFF]],
            "light_staff":      ["template_3d_staff",  "STAFF",  [0x4D3D00, 0xB38F00, 0xFFEE66, 0xFFFFFF]],
            "water_staff":      ["template_3d_staff",  "STAFF",  [0x001D3D, 0x003566, 0x00B4D8, 0xCAF0F8]],
            "void_staff":       ["template_3d_staff",  "STAFF",  [0x10002B, 0x3C096C, 0x9D4EDD, 0xE0AAFF]],
