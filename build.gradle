            "crystal_staff":    ["template_3d_staff",  "STAFF",  [0x240046, 0x7B2CBF, 0xFF70A6, 0xFFCAE9]],
            "nether_staff":     ["template_3d_staff",  "STAFF",  [0x210404, 0x6A040F, 0xDC2F02, 0xFFBA08]],
            "arcane_wand":      ["template_3d_staff",  "STAFF",  [0x1A0933, 0x5A189A, 0xC77DFF, 0xFFFFFF]],

            // 9. Shields, Orbs & Utility
            "guardian_shield":  ["template_3d_shield", "SHIELD", [0x2D1E12, 0x5C4028, 0x8B5A2B, 0xCCA662]],
            "elemental_shield": ["template_3d_shield", "SHIELD", [0x1B263B, 0x415A77, 0x00F5D4, 0xFEE440]],
            "void_orb":         ["template_3d_orb",    "ORB",    [0x0B0014, 0x2B0040, 0x7A1FA2, 0xE1BEE7]],
            "dark_orb":         ["template_3d_orb",    "ORB",    [0x050505, 0x210035, 0x6200EA, 0xB388FF]],
            "light_orb":        ["template_3d_orb",    "ORB",    [0x4A3B00, 0xF57F17, 0xFFEE58, 0xFFFFFF]],
            "grappling_hook":   ["template_3d_blade",  "DAGGER", [0x222629, 0x545D63, 0x8C9BA5, 0xD0DDE6]]
        ]

        itemsSpec.each { id, spec ->
            def tmpl = spec[0]
            def shape = spec[1]
            def palette = spec[2]

            new File(itemsDir, "${id}.json").text = """{
  "model": {
    "type": "minecraft:select",
    "property": "minecraft:display_context",
    "cases": [
      {
        "when": ["gui", "fixed"],
        "model": {
          "type": "minecraft:model",
          "model": "custom_arsenal:item/${id}_gui"
        }
      },
      {
        "when": ["ground"],
        "model": {
          "type": "minecraft:model",
          "model": "custom_arsenal:item/${id}_ground"
        }
      }
    ],
    "fallback": {
      "type": "minecraft:model",
      "model": "custom_arsenal:item/${id}_3d"
    }
  }
}"""

            new File(modelsDir, "${id}_gui.json").text = """{
  "parent": "minecraft:item/handheld",
  "textures": {
    "layer0": "custom_arsenal:item/${id}"
  }
}"""

            def model3d = """{
  "parent": "custom_arsenal:item/${tmpl}",
  "textures": {
    "layer0": "custom_arsenal:item/${id}"
  }
}"""
            new File(modelsDir, "${id}_3d.json").text = model3d
            new File(modelsDir, "${id}_ground.json").text = model3d

            // Generate 32x32 HD shaded weapon sprite
            def pngFile = new File(texturesDir, "${id}.png")
            BufferedImage img = new BufferedImage(32, 32, BufferedImage.TYPE_INT_ARGB)
            Color c0 = new Color(palette[0] as int)
            Color c1 = new Color(palette[1] as int)
            Color c2 = new Color(palette[2] as int)
            Color c3 = new Color(palette[3] as int)

            for (int y = 0; y < 32; y++) {
                for (int x = 0; x < 32; x++) {
                    if (shape == "ORB") {
                        double dist = Math.hypot(x - 15.5d, y - 15.5d)
                        if (dist <= 12.0d) {
                            Color col = dist < 4.0d ? c3 : (dist < 7.5d ? c2 : (dist < 10.2d ? c1 : c0))
                            img.setRGB(x, y, col.getRGB())
                        }
                    } else if (shape == "SHIELD") {
                        if (x >= 5 && x <= 26 && y >= 2 && y <= 29 && (y < 18 || (x - 5 >= (y - 17) * 0.8 && 26 - x >= (y - 17) * 0.8))) {
                            boolean border = (x <= 6 || x >= 25 || y <= 3 || y >= 28)
                            boolean emblem = (Math.abs(x - 15.5) <= 2 || Math.abs(y - 13) <= 2)
                            Color col = border ? c0 : (emblem ? c3 : ((x + y) % 2 == 0 ? c2 : c1))
                            img.setRGB(x, y, col.getRGB())
                        }
                    } else if (shape == "BOW") {
                        double arcDist = Math.hypot(x - 8.0d, y - 16.0d)
                        if (arcDist >= 11.0d && arcDist <= 14.2d && x >= 7) {
                            Color col = arcDist < 12.5d ? c2 : c1
                            img.setRGB(x, y, col.getRGB())
                        } else if (x == 9 && y >= 5 && y <= 27) {
                            img.setRGB(x, y, c3.getRGB())
                        }
                    } else {
                        // Diagonal shaft/blade from bottom-left (3,28) to top-right (28,3)
                        int rx = x
                        int ry = 31 - y
                        int diag = ry - rx
                        int along = rx + ry

                        if (along >= 6 && along <= 16 && Math.abs(diag) <= 1) {
                            img.setRGB(x, y, (along <= 8 ? c3 : c0).getRGB()) // Pommel & Grip
                        } else if (along >= 16 && along <= 19 && Math.abs(diag) <= 6) {
                            img.setRGB(x, y, (Math.abs(diag) <= 2 ? c3 : c1).getRGB()) // Guard
                        } else if (shape == "MACE" || shape == "HAMMER") {
                            if (along >= 19 && along <= 36 && Math.abs(diag) <= 1) {
                                img.setRGB(x, y, c1.getRGB())
                            }
                            if (along >= 36 && along <= 50 && Math.abs(diag) <= (shape == "HAMMER" ? 8 : 5)) {
                                Color col = Math.abs(diag) <= 1 ? c3 : (Math.abs(diag) <= 3 ? c2 : c0)
                                img.setRGB(x, y, col.getRGB())
                            }
                        } else if (shape == "AXE" || shape == "SCYTHE") {
                            if (along >= 19 && along <= 48 && Math.abs(diag) <= 1) {
                                img.setRGB(x, y, c1.getRGB())
                            }
                            if (along >= 34 && along <= 48 && diag >= -9 && diag <= (shape == "SCYTHE" ? 2 : 6)) {
                                Color col = Math.abs(diag) >= 6 ? c3 : (Math.abs(diag) >= 3 ? c2 : c0)
                                img.setRGB(x, y, col.getRGB())
                            }
                        } else if (shape == "STAFF" || shape == "SPEAR") {
                            if (along >= 16 && along <= 44 && Math.abs(diag) <= 1) {
                                img.setRGB(x, y, c1.getRGB())
                            }
                            if (along >= 44 && along <= 56 && Math.abs(diag) <= (shape == "STAFF" ? 4 : 2)) {
                                Color col = Math.abs(diag) == 0 ? c3 : (Math.abs(diag) <= 2 ? c2 : c0)
                                img.setRGB(x, y, col.getRGB())
                            }
                        } else {
                            // SWORD / DAGGER
                            int maxLen = (shape == "DAGGER") ? 40 : 54
                            if (along >= 19 && along <= maxLen && Math.abs(diag) <= 2) {
                                Color col = (diag == 0) ? c3 : (Math.abs(diag) == 1 ? c2 : c0)
                                img.setRGB(x, y, col.getRGB())
                            }
                        }
                    }
                }
            }
            ImageIO.write(img, "PNG", pngFile)
        }
    }
}

processResources {
    dependsOn generateBundledAssets
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
